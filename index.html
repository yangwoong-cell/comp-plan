<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>압축기 생산계획</title>
<style>
:root{
  --bg:#f1efe9; --panel:#fff; --ink:#1c2432; --ink2:#5b6475; --line:#d8d3c6; --line2:#e8e4d9;
  --navy:#1d3b5c; --navy2:#2b5584; --p2:#2f6f9f; --p2bg:#e1edf7; --p3:#2b7a6a; --p3bg:#dff0ea;
  --amber:#f2b134; --we:#ece8dd; --hol:#f3dcd8; --today:#fff6d6;
  --b:#a9d0f5; --g:#b9e6a1; --y:#fff08a; --o:#ffc078; --r:#ff8b82;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.35 "Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#top{height:52px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--navy);color:#fff}
#top h1{font-size:15px;white-space:nowrap;margin:0 8px 0 0;letter-spacing:.2px;white-space:nowrap}
.tabs{display:flex;gap:2px}
.tab{white-space:nowrap;background:transparent;color:#cfd9e6;border:0;padding:8px 14px;border-radius:6px 6px 0 0;font-weight:600}
.tab.on{background:var(--bg);color:var(--navy)}
.sp{flex:1}
.btn{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:6px;font-weight:600}
.btn:hover{background:#f7f5ef}
.btn.pri{background:var(--amber);border-color:#d99a1e;color:#2a1d00}
.btn.pri:hover{background:#f6bd50}
.btn.dng{color:#a3231a}
.btn.sm{padding:2px 7px;font-size:12px}
#top .btn{padding:6px 9px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
#top .btn:hover{background:rgba(255,255,255,.2)}
#top .btn.pri{background:var(--amber);color:#2a1d00;border-color:#d99a1e}
#view{height:calc(100vh - 52px);overflow:hidden;display:flex;flex-direction:column}
.legend{display:flex;gap:14px;align-items:center;padding:6px 14px;background:#e9e5da;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
#gridwrap{flex:1;overflow:auto;position:relative;background:var(--bg)}
.inner{position:relative}
.row{display:flex}
.left{position:sticky;left:0;z-index:12;display:flex;flex:none;background:var(--panel)}
.lc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 5px;display:flex;align-items:center;min-width:0}
.sumblock{position:sticky;top:0;z-index:30;background:var(--panel);box-shadow:0 2px 0 var(--line)}
.sumblock .left{z-index:31}
.hdrrow .lc{background:var(--navy);color:#fff;font-weight:700;justify-content:center;border-color:#37587c}
.dcell{flex:none;width:70px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line);text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:26px;font-variant-numeric:tabular-nums}
.dstb{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);white-space:nowrap;width:auto;min-width:0;font-size:10.5px;line-height:1.1;padding:2px 8px;border:1px solid var(--navy2);border-radius:10px;background:#fff;color:var(--navy);cursor:pointer;font-weight:600}.dstb:hover{background:var(--navy);color:#fff}
.hdrrow .dcell{background:#f7f5ef;height:82px;padding-bottom:20px;overflow:hidden;line-height:1.15;justify-content:flex-start;padding-top:4px}
.hdrrow .dcell b{font-size:12px}
.hdrrow .dcell i{font-style:normal;font-size:11px;color:var(--ink2)}
.dcell.we{background:var(--we)}
.dcell.hol{background:var(--hol)}
.hdrrow .dcell.rd b,.hdrrow .dcell.rd i{color:#d12a1c}
.hdrrow .dcell .dn{display:block;font-size:9px;line-height:10px;color:#4a5262;max-height:20px;overflow:hidden;padding:0 2px;margin-top:1px;word-break:keep-all;overflow-wrap:anywhere;text-decoration:none}
.hd{cursor:pointer;position:relative}
.hd:hover{filter:brightness(.93)}
.bd{position:absolute;bottom:24px;left:0;right:0;font-size:9px;text-decoration:none;font-weight:700;line-height:11px}
.bd.h{background:#2f6f9f;color:#fff}
.bd.e{background:#8a5cc4;color:#fff}
.dcell.today{background-image:linear-gradient(rgba(232,89,12,.10),rgba(232,89,12,.10));box-shadow:inset 2px 0 0 #e8590c,inset -2px 0 0 #e8590c}
.hdrrow .dcell.today{background:#e8590c;background-image:none;box-shadow:none}
.hdrrow .dcell.today b,.hdrrow .dcell.today i{color:#fff!important}
.tdb{position:absolute;top:3px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;font-weight:800;letter-spacing:1px;background:#ffd24a;color:#4a3500;border-radius:3px;padding:0 5px;line-height:13px}
.hdrrow .dcell.today b{margin-top:14px}
.dcell.ms{border-left:2px solid var(--navy2)}
.lbl{font-weight:700;width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.lbl small{font-weight:500;color:var(--ink2)}
.sumrow .lc{background:#faf8f3}
.sumrow.tot .lc{background:#efeadb;border-bottom:2px solid var(--line)}
.sumrow.tot .dcell{font-weight:700;border-bottom:2px solid var(--line)}
.sumrow .dcell{height:28px}
.capa-in{width:62px;border:1px solid transparent;background:transparent;text-align:center;padding:2px 0;border-radius:4px}
.capa-in:hover,.capa-in:focus{border-color:var(--navy2);background:#fff;outline:0}
.rate-b{background:var(--b)}.dcell.rate-b{background:var(--b)}.rate-g{background:var(--g)}.rate-y{background:var(--y)}.rate-o{background:var(--o)}.rate-r{background:var(--r);font-weight:700}.dcell.rate-g{background:var(--g)}.dcell.rate-y{background:var(--y)}.dcell.rate-o{background:var(--o)}.dcell.rate-r{background:var(--r);font-weight:700}
.crane-r{background:#ff6b6b;color:#fff;font-weight:700}
.erow{box-sizing:content-box;border-bottom:3px solid #4a6485;margin-bottom:6px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.erow{border-bottom:0;margin-bottom:8px;box-shadow:none}
.erow .left{--c:#9fb3cc;border-radius:10px 0 0 10px;box-shadow:inset 6px 0 0 var(--c),0 1px 4px rgba(0,0,0,.18)}
.erow .left .lc{border-right-color:rgba(0,0,0,.07)}
.erow .left .lc:first-child{padding-left:12px}
.erow .left{background:var(--panel)}
.erow .lc{border-bottom:0;padding:4px 5px;align-items:flex-start;flex-direction:column;gap:3px;justify-content:center}
.erow input.fld,.erow select.fld{width:100%;border:1px solid var(--line2);border-radius:5px;padding:3px 4px;background:#fcfbf8}
.erow .left .lc:not(:first-child) .fld{text-align:center;text-align-last:center}
.erow input.fld:focus,.erow select.fld:focus{outline:2px solid #8db5e0;background:#fff}
.eact{display:flex;gap:3px;flex-wrap:wrap}
.tl{position:relative;flex:none;overflow:hidden}
.tl .bgd{position:absolute;inset:0;background-image:repeating-linear-gradient(to right,transparent 0,transparent 69px,var(--line2) 69px,var(--line2) 70px)}
.tl .nw{position:absolute;top:0;bottom:0;background:rgba(160,150,120,.14)}
.tl .tdy{position:absolute;top:0;bottom:0;width:70px;box-sizing:border-box;background:rgba(232,89,12,.08);border-left:2px solid #e8590c;border-right:2px solid #e8590c;pointer-events:none}
.card{position:absolute;border-radius:7px;padding:2px 5px 1px;overflow:hidden;cursor:grab;user-select:none;touch-action:none;border:1px solid;border-left-width:5px;box-shadow:0 1px 2px rgba(20,30,50,.15);font-size:11.5px;line-height:1.25;display:flex;flex-direction:column;justify-content:flex-start;gap:1px}
.card .cx{position:absolute;top:1px;right:1px;width:15px;height:15px;line-height:13px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.75);color:#a3231a;font-size:12px;font-weight:700;cursor:pointer;opacity:.55;text-align:center}
.card:hover .cx{opacity:1}
.card .cx:hover{background:#a3231a;color:#fff}
.card .c1{padding-right:11px}
.card.s2{background:var(--p2bg);border-color:var(--p2)}
.card.s3{background:var(--p3bg);border-color:var(--p3)}
.card.wit{box-shadow:0 1px 2px rgba(20,30,50,.15),inset 0 3px 0 var(--amber)}
.card.add{border-style:dashed;border-left-style:solid}
.card.est{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.06) 0 5px,transparent 5px 10px)}
.card.drag{opacity:.85;cursor:grabbing;z-index:50;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.card .c1{font-weight:700;color:inherit;word-break:keep-all;overflow-wrap:anywhere}
.card .c1 em{font-style:normal;opacity:.7;font-weight:500;font-size:10px;margin-right:3px}
.card .c2{display:flex;gap:3px;align-items:center;flex-wrap:wrap;font-size:9.5px}
.pill{line-height:14px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:700;background:#fff;border:1px solid var(--line)}
.pill.nm{background:#eee;color:#555;border-color:#aaa;border-style:dashed}
.pill.w{background:var(--amber);border-color:#d99a1e;color:#2a1d00}
.pill.p2{background:var(--p2);color:#fff;border-color:var(--p2)}
.pill.p3{background:var(--p3);color:#fff;border-color:var(--p3)}
.card .part{font-size:10px;font-weight:700;color:#8a5cc4}
.pill.ngt{background:#2b2d6e;color:#ffe08a;border-color:#2b2d6e}
.pill.ot{background:#b3261e;color:#fff;border-color:#b3261e}
.pill.dn{background:#1f2a44;color:#ffd24a;border-color:#1f2a44}
.lt{font-weight:700;color:var(--ink)}
.card .sl{display:inline-flex;gap:3px;align-items:center;white-space:nowrap;flex:none}
.bubble{position:fixed;z-index:200;background:var(--navy);color:#fff;padding:3px 8px;border-radius:5px;font-weight:700;pointer-events:none;font-size:12px}
.empty{padding:40px;color:var(--ink2);text-align:center}
/* modal */
#modalRoot{position:fixed;inset:0;z-index:100;display:none;background:rgba(20,28,40,.5);align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
#modalRoot.on{display:flex}
.mdl{background:var(--panel);border-radius:10px;width:min(780px,100%);box-shadow:0 14px 50px rgba(0,0,0,.4)}
.mdl.narrow{width:min(520px,100%)}
.adj{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.adj .btn{padding:2px 7px}
.l1-in{width:62px;border:1px solid transparent;background:transparent;text-align:center;padding:2px 0;border-radius:4px;font:inherit}.l1-in:hover,.l1-in:focus{border-color:var(--navy2);background:#fff;outline:0}
.dtype{display:grid;gap:6px}.dsub2{display:grid;gap:4px;margin:0 0 0 26px;padding:6px 10px;border-left:3px solid var(--line)}
.rlg{display:inline-flex;gap:3px;margin-left:auto;margin-right:8px}.rlg i{font-style:normal;font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px;border:1px solid rgba(0,0,0,.12);color:#2a2a2a;white-space:nowrap}
.dsum{display:flex;flex-wrap:wrap;gap:6px 14px;background:#f1ede2;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}.dsum b{color:var(--navy)}
.dst{width:100%}.dst .dgh td{background:#dfe7f1;font-weight:700;color:var(--navy);text-align:left}.dst .dsub td{background:#f6f1e3;border-top:1px solid var(--line)}.dst td.c{text-align:center}.dst td.n{text-align:right}
.mhead{padding:12px 18px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700;background:var(--navy);color:#fff;border-radius:10px 10px 0 0}
.mbody{padding:14px 18px;display:grid;gap:12px}
.mfoot{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.area{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.area h4{margin:0;padding:6px 12px;background:#ece8dc;font-size:13px}
.area .ab{padding:10px 12px;display:grid;gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px}
.fl{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2);font-weight:600}
.fl input,.fl select,.fl textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--ink);font-weight:400;background:#fff}
.ck{display:flex;gap:6px;align-items:center;padding:5px 8px;border:1px solid var(--line2);border-radius:6px;cursor:pointer;background:#fcfbf8}
.ck:hover{background:#f3efe4}
.ck input{margin:0}
.ck.on{background:#fff4d6;border-color:#e3b650}
.pv{font-size:12px;color:var(--ink2);background:#f6f3ea;border-radius:6px;padding:8px 10px}
.pv b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:11px}
.note{font-size:11.5px;color:var(--ink2)}
.warn{color:#a3231a}
/* tables */
.pane{flex:1;overflow:auto;padding:0}
.pane>.bar{padding:12px 14px 10px;margin:0;position:sticky;top:0;left:0;z-index:20;background:var(--bg);box-sizing:border-box}
.pane>table.tbl{margin:0 14px 14px}
.pane>.empty{margin:14px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
table.tbl{border-collapse:separate;border-spacing:0;background:#fff;font-size:12px}
.tbl th,.tbl td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:2px 3px;white-space:nowrap}
.tbl th{background:var(--navy);color:#fff;position:sticky;top:var(--barh,0px);z-index:5;font-weight:600;padding:5px 6px}
.tbl th.h2{top:calc(var(--barh,0px) + 26px)}
.tbl input,.tbl select{border:1px solid transparent;background:transparent;padding:3px 4px;width:100%;border-radius:4px}
.tbl input:hover,.tbl select:hover{border-color:var(--line)}
.tbl input:focus,.tbl select:focus{outline:2px solid #8db5e0;background:#fff}
.tbl td.sk{position:sticky;background:#fff;z-index:3}
.tbl th.sk{z-index:7}
.tbl tr:hover td{background:#faf8f1}
.tbl tr:hover td.sk{background:#faf8f1}
.tbl input.n{width:62px;text-align:right}
.tbl input.n.miss::placeholder{color:#b9b3a3}
.tbl input.n.nav{color:#999;background:#f0eee7;text-align:center}
.swb{border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:11px;min-width:96px;background:linear-gradient(90deg,var(--p2bg) 50%,var(--p3bg) 50%);color:var(--ink)}
.pal{position:fixed;z-index:250;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.3);width:236px}
.pal h5{margin:6px 0 4px;font-size:11px;color:var(--ink2)}
.pal .g{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.pal .g i{display:block;height:20px;border:1px solid rgba(0,0,0,.2);cursor:pointer}
.pal .g i:hover{outline:2px solid var(--navy2)}
.pal .def{width:100%;margin-bottom:4px;background:linear-gradient(90deg,var(--p2bg) 50%,var(--p3bg) 50%);font-weight:700}
.tbl .grpb{border-left:2px solid var(--navy2)}
#btnPw,#btnLogout{display:none}
#loginRoot{display:none;position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#1d3b5c,#2b5584);align-items:center;justify-content:center;padding:16px}
#loginRoot.on{display:flex}
.lgbox{background:#fff;border-radius:14px;padding:28px 28px 22px;width:min(380px,100%);box-shadow:0 20px 60px rgba(0,0,0,.45);display:grid;gap:12px}
.lgbox h2{margin:0;font-size:18px;color:var(--navy)}.lgbox input[type=password]{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;width:100%}
.lgbox .err{color:#c0322a;font-size:12.5px;min-height:16px}.lgbox label.ck{font-size:12.5px;color:var(--ink2)}
#modeBadge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--amber);color:#2a1d00;vertical-align:2px;margin-left:6px}
#modeBadge:empty{display:none}
#wkBox{font-size:13px;color:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);padding:3px 8px;border-radius:7px}
#wkBox input{color:#1c2432;background:#fff;width:64px;text-align:center;border:1px solid #8aa;border-radius:5px;padding:2px 3px;font-size:13px;letter-spacing:1px}
#wkTxt{display:none;font-weight:700;color:#ffd98a}
body.ro #wkIn,body.ro #wkSave{display:none}body.ro #wkTxt{display:inline}body.ro #wkBox b+*{}
#shareStat{font-size:12px;color:#cfd9e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:300px}
body.ro .roh,body.ro #btnAdd,body.ro #btnHidden,body.ro #btnUndo,body.ro #btnRedo,body.ro #btnImp,body.ro #btnExp,body.ro #btnConnect,body.ro .eact,body.ro .cx,body.ro [data-act=padd],body.ro [data-act=pdel],body.ro [data-act=stdcopy]{display:none!important}
body.ro .capa-max,body.ro [data-act=stdreset]{display:none}
.capa-max{font-weight:500;font-size:12px;display:flex;gap:4px;align-items:center}
.capa-max input{width:56px;border:1px solid var(--line);border-radius:5px;padding:2px 4px;text-align:center}
body.ro .swb{pointer-events:none}
body.ro .hd{cursor:default}
body.ro .card{cursor:pointer}
body.ro input:disabled,body.ro select:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);background:transparent;border-color:transparent;-webkit-appearance:none;appearance:none}
body.ro .erow input.fld,body.ro .erow select.fld{background:transparent}
body.ro .capa-in:hover{border-color:transparent;background:transparent}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:.25s;z-index:300;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="top">
  <h1>압축기 생산계획 관리 <span id="modeBadge"></span></h1>
  <div class="tabs">
    <button class="tab on" data-tab="dash">대시보드</button>
    <button class="tab" data-tab="proc">공정</button>
    <button class="tab" data-tab="opt">옵션</button>
    <button class="tab" data-tab="done">완료장비 <span id="doneCnt"></span></button>
    <button class="tab" data-tab="std">표준공수</button>
  </div>
  <div class="sp"></div>
  <span id="wkBox"><b>주간생산계획</b> '<input id="wkIn" inputmode="numeric" maxlength="6" placeholder="YYMMDD" autocomplete="off">' 기준 <button class="btn sm" id="wkSave">저장</button><span id="wkTxt"></span></span>
  <button class="btn" id="btnUndo" disabled>↶ 되돌리기</button>
  <button class="btn" id="btnRedo" disabled>↷ 다시</button>
  <button class="btn" id="btnHidden" title="숨긴 장비 목록">👁 숨김 장비 <span id="hidCnt"></span></button>
  <button class="btn pri" id="btnAdd">＋ 장비 추가</button>
  <button class="btn" id="btnToday">오늘</button>
  <button class="btn" id="btnConnect">🔗 공유 연결</button>
  <button class="btn" id="btnPw" title="편집용 접속 비밀번호 변경">🔑 비밀번호 변경</button><button class="btn" id="btnLogout">로그아웃</button>
  <span id="shareStat"></span>
  <button class="btn" id="btnSet">설정</button>
  <button class="btn" id="btnXls">엑셀 다운로드</button>
  <button class="btn" id="btnPrint" title="인쇄 설정 및 인쇄">🖨 인쇄</button>
  <button class="btn" id="btnExp">백업 저장</button>
  <button class="btn" id="btnImp">백업 불러오기</button>
  <input type="file" id="fileImp" accept=".json" hidden>
</div>
<div id="view"></div>
<div id="modalRoot"></div>
<div id="loginRoot"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

const DEFFIELDS=['no','name','type','altNo','witness','site','owner','noMan','unit','crane2','crane3','opt1','opt2','opt3','remark'];
function seedMap(old){
  const SP=SEED.master.processes,used=new Set(),map=new Map(),seedNames=new Set(SP.map(p=>p.name));
  const byName=new Map(old.map(p=>[p.name,p]));
  for(const sp of SP){
    let ex=byName.get(sp.name);if(ex&&used.has(ex.id))ex=null;
    if(!ex)ex=old.find(p=>p.id===sp.id&&!used.has(p.id)&&!seedNames.has(p.name));
    if(ex){used.add(ex.id);map.set(sp.id,ex.id)}

}

  const M=S.master,SP=SEED.master.processes,old=M.processes,map=seedMap(old),oldById=new Map(old.map(p=>[p.id,p]));
  const ids=new Set(old.map(p=>p.id)),out=[],usedOld=new Set();
  for(const sp of SP){
    const eid=map.get(sp.id);let p;
    if(eid){p=oldById.get(eid);usedOld.add(eid);for(const f of DEFFIELDS)p[f]=sp[f]===undefined?'':sp[f];if(p.unit==='')delete p.unit}
    else{p=JSON.parse(JSON.stringify(sp));if(ids.has(p.id))p.id='P'+uid();ids.add(p.id);map.set(sp.id,p.id)}
    out.push(p);
  }
  for(const p of old){if(usedOld.has(p.id))continue;let k=-1;out.forEach((q,i)=>{if(Number(q.no)<=Number(p.no))k=i});out.splice(k+1,0,p)}

}

const isRestDay=n=>{const ov=(S.settings.dayOv||{})[ds(n)];if(ov)return !!ov.off||!(ov.hp&&ov.ext);return !dayDefault(n)}; // 휴무일(정상근무일이 아닌 날) — HP·협력업체 작업 가능 체크와 무관하게 휴무 표시(빨간 글자·음영) 적용

/* 달력 변경 시 수동 지정 시작일을 '날짜' 기준으로 유지 */
function rebuildCal(){
  const keep=[];
  for(const eq of S.equipments)for(const p of eq.procs)if(p.manualStart!=null){const i=Math.floor(p.manualStart+1e-9);keep.push([p,WD[i],p.manualStart-i])}

const availIdx=(owner,i)=>(owner==='협력업체'?EXA:HPA)[i]!==false&&i>=0&&i<WD.length;
function nextAvail(owner,pos){let d=Math.floor(pos+1e-9);if(availIdx(owner,d))return pos;d++;while(d<WD.length&&!availIdx(owner,d))d++;return d}
function addWork(s,lt,owner){
  let rem=lt,pos=s;
  while(rem>1e-9){let d=Math.floor(pos+1e-9);if(!availIdx(owner,d)){pos=d+1;continue}
    const sp=d+1-pos;if(rem<=sp+1e-9){pos+=rem;rem=0}else{rem-=sp;pos=d+1}}
  return pos;
}
function wdIdx(n){let lo=0,hi=WD.length;while(lo<hi){const m=(lo+hi)>>1;if(WD[m]<n)lo=m+1;else hi=m}return lo}
const isHol=n=>S.settings.holidays.includes(ds(n));

/* ---------- master helpers ---------- */
const pmap=()=>new Map(S.master.processes.map(p=>[p.id,p]));
function stdMd(pid,cat,model,stage){
  const t=(pid&&S.master.manday[pid])||{};
  const has=k=>t[k]!=null&&t[k]!==''&&t[k]!=='NA';
  const k=`${cat}|${model}|${stage}`;
  if(t[k]==='NA')return{v:0,est:false,na:true};
  if(has(k))return{v:+t[k],est:false};
  const mi=MODELS.indexOf(model);
  const order=MODELS.map((m,i)=>[m,Math.abs(i-mi)]).sort((a,b)=>a[1]-b[1]);
  for(const c of (cat==='AIR'?['AIR']:[cat,'AIR']))for(const [m] of order){const kk=`${c}|${m}|${stage}`;if(has(kk))return{v:+t[kk],est:true,from:`${c} ${m} ${stage}단`}}
  return{v:0,est:true,from:null};
}
const pOpts=p=>[p.opt1,p.opt2,p.opt3].filter(Boolean);
function expectedPids(eq){
  const opts=new Set(eq.options),P=S.master.processes;
  const naP=p=>stdMd(p.id,eq.cat,eq.model,eq.stage).na===true;
  const cond=p=>{const o=pOpts(p);return o.length>0&&o.every(x=>opts.has(x))&&!naP(p)};
  const replaced=new Set(P.filter(p=>p.type==='대체옵션'&&cond(p)).map(p=>String(p.altNo)));
  const res=[];
  for(const p of P){
    if(p.type==='기본'){if(!replaced.has(String(p.no))&&!naP(p))res.push(p.id)}
    else if(cond(p)&&(p.type==='대체옵션'||!replaced.has(String(p.no))))res.push(p.id);
  }
  return res.filter(id=>!(eq.excluded||[]).includes(id));
}
function syncEq(eq){
  const P=pmap(),exp=new Set(expectedPids(eq));
  const keep=eq.procs.filter(i=>i.added?true:(i.pid&&exp.has(i.pid)&&P.has(i.pid)));
  const seen=new Set();for(let k=keep.length-1;k>=0;k--){const i=keep[k];if(!i.added&&i.pid){if(seen.has(i.pid))keep.splice(k,1);else seen.add(i.pid)}} // 같은 공정 중복 정리
  const have=new Set(keep.filter(i=>i.pid).map(i=>i.pid));
  for(const id of exp)if(!have.has(id))keep.push({uid:uid(),pid:id,crew:null,md:null,ov:{},manualStart:null});
  eq.procs=keep.filter(i=>!i.splitOf||keep.some(x=>x.uid===i.splitOf));
}
/* 옵션/공정 구성 변경 시: 변경 지점 이전 공정은 그대로, 삽입·삭제 지점 이후(고정 시작일 포함)만 변경분만큼 이동 */
function withKeep(eq,fn,oc0){
  const oc=oc0||new Map(schedule(eq).map(i=>[i.inst.uid,i.cur]));
  fn();syncEq(eq);
  for(let g=0;g<eq.procs.length+2;g++){
    let moved=false;
    for(const it of schedule(eq)){
      if(it.inst.manualStart==null||!oc.has(it.inst.uid))continue;
      const dl=it.cur-oc.get(it.inst.uid);
      if(Math.abs(dl)>1e-9){it.inst.manualStart+=dl;oc.set(it.inst.uid,it.cur);moved=true;break}
    }
    if(!moved)break;
  }
}
function newEq(o){

}
/* 장비 최초 생성 시: 공정 카드를 하루에 1개씩(공정 순서대로, 소요일이 1일 초과면 올림한 일수만큼 차지) 배치 */
function spreadDaily(eq){
  let day=wdIdx(dn(eq.start));
  for(const inst0 of [...schedule(eq)].map(i=>i.inst)){
    const cur=schedule(eq).find(x=>x.inst===inst0);if(!cur)continue;
    if(cur.d.parNo!==''&&cur.d.parNo!=null)continue; // 병행 공정은 기준 공정을 따름
    inst0.manualStart=day;
    const it=schedule(eq).find(x=>x.inst===inst0);

function crane3Line(d,eq){
  const c=(d.crane3||'').trim();if(!c||c==='X')return null;
  if(c.includes(' or ')){const p=c.split(' or ').map(x=>x.trim());return p.includes(eq.moveLine)?eq.moveLine:p[0]}

/* ---------- scheduling ---------- */
const manLoaded=d=>(!d.owner||d.owner==='HP')&&d.noMan!=='X';
const cardLbl=it=>it.d.noMan==='X'?'':manLoaded(it.d)?f1(it.lt*it.crew)+'md':f1(it.lt)+'d'; // 직접인력 투입 공정은 Man-day(md), 그 외(협력·불필요)는 LT(d)
function schedule(eq){
  const P=pmap(),arr=[];
  for(const inst of eq.procs){
    const m=inst.pid?P.get(inst.pid):null;
    if(inst.pid&&!m&&!inst.added)continue;
    const d=Object.assign({},m||{},inst.ov||{});
    if(!d.name)continue;
    arr.push({inst,d,ord:inst.order!=null?inst.order:(Number(d.no)||0)});
  }
  arr.sort((a,b)=>a.ord-b.ord);
  let cursor=wdIdx(dn(eq.start));
  const anchors={};
  for(const it of arr){
    const {inst,d}=it;it.cur=cursor;
    const sm=inst.md!=null?{v:+inst.md,est:false}:stdMd(inst.pid,eq.cat,eq.model,eq.stage);
    it.md=sm.v;it.est=sm.est&&inst.md==null;it.from=sm.from;
    it.crew=inst.crew||S.settings.crew;
    if(d.unit==='LT'){it.lt=it.md;it.md=it.lt*HPD*it.crew}else it.lt=it.md/HPD/it.crew;
    let s;
    if(inst.manualStart!=null)s=inst.manualStart;
    else if(d.parNo!==''&&d.parNo!=null&&anchors[d.parNo]!=null)s=anchors[d.parNo]+Number(d.parOff||0);
    else s=cursor;
    const ow=d.owner||'HP';
    it.ot=0;let L=it.lt;
    if(d.ot==='O'&&it.lt>1+1e-6){const fr=it.lt-Math.floor(it.lt+1e-9);if(fr>1e-6&&fr<=0.5+1e-9){it.ot=fr;L=it.lt-fr}} // 잔업: 마지막 날 초과분(≤0.5일)을 그 날 부하로 합산
    if(it.lt>0)s=nextAvail(ow,s);
    it.s=s;it.e=it.lt>0?addWork(s,L,ow):s;
    if(inst.added&&!inst.par)cursor=Math.max(cursor,s)+(it.e-s);
    else cursor=Math.max(cursor,it.e);
    if(d.no!=null&&anchors[d.no]==null)anchors[d.no]=s;
  }
  // 분할 공정 번호(1/3 …)
  const grp=new Map();for(const it of arr){const g=it.inst.splitOf||it.inst.uid;(grp.get(g)||grp.set(g,[]).get(g)).push(it)}
  for(const [g,L] of grp){const has=L.some(x=>x.inst.splitOf);if(!has)continue;L.sort((a,b)=>a.ord-b.ord);L.forEach((x,k)=>x.part=[k+1,L.length])}
  // lanes
  const ends=[];
  for(const it of [...arr].sort((a,b)=>a.s-b.s)){
    let l=0;while(ends[l]!=null&&ends[l]>it.s+1e-6)l++;
    ends[l]=it.e;it.lane=l;
  }
  arr.lanes=Math.max(1,ends.length);
  return arr;
}
function calc(){
  SCH.clear();
  AGG={load2:new Map(),load3:new Map(),load:new Map(),c2:new Map(),c3:{A:new Map(),B:new Map(),C:new Map()}};
  const add=(m,i,v)=>m.set(i,(m.get(i)||0)+v);
  for(const eq of S.equipments){
    const items=schedule(eq);SCH.set(eq.id,items);
    if(eq.done)continue; // 생산완료 장비는 부하·크레인 집계에서 제외
    for(const it of items){
      const d=it.d,ls=Math.floor(it.s+1e-9),le=Math.ceil(it.e-1e-9);
      for(let i=ls;i<le;i++){
        if(!availIdx(d.owner||'HP',i))continue;const ov=Math.min(it.e,i+1)-Math.max(it.s,i);if(ov<=1e-9)continue;
        if((!d.owner||d.owner==='HP')&&d.noMan!=='X'){add(AGG.load,i,it.crew*ov);add(d.site==='3P'?AGG.load3:AGG.load2,i,it.crew*ov)}
        if(d.crane2==='O')add(AGG.c2,i,ov);
        const l=crane3Line(d,eq);if(l)add(AGG.c3[l],i,ov);
      }
      if(it.ot&&(!d.owner||d.owner==='HP')&&d.noMan!=='X'){
        let li=le-1;while(li>ls&&!availIdx(d.owner||'HP',li))li--;
        const x=it.crew*it.ot;add(AGG.load,li,x);add(d.site==='3P'?AGG.load3:AGG.load2,li,x);
      }
    }
  }
}

/* ---------- dashboard render ---------- */
const _cv=document.createElement('canvas').getContext('2d');
function tw(txt,px,bold){_cv.font=`${bold?700:400} ${px}px "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif`;return _cv.measureText(txt).width}
function wrapLines(txt,wd){let lines=1,cur=0;for(const w of txt.split(/\s+/)){const ww=tw(w+' ',11.5,true);if(ww>wd){const n=Math.ceil(ww/wd);lines+=(cur>0?1:0)+n-1;cur=ww-(n-1)*wd;continue}if(cur>0&&cur+ww>wd){lines++;cur=ww}else cur+=ww}return lines}
const CARDFS=10.5; // 공정카드 글자 크기(px)
function wrapN(txt,wd,fs){let lines=1,cur=0,ok=true;for(const w of txt.split(/\s+/).filter(Boolean)){const ww=tw(w,fs,true),sp=tw(' ',fs,true);if(ww>wd)ok=false;if(cur>0&&cur+sp+ww>wd){lines++;cur=ww}else cur+=(cur>0?sp:0)+ww}return {lines,ok}}
function fitName(txt,wd){ // 카드 폭에 맞춰 글자 크기를 최대한 키우되, 단어가 중간에서 잘리지 않게 함
  wd*=0.9;
  const base=wrapN(txt,wd,11.5).lines;
  for(let fs=13;fs>=9;fs-=0.25){const r=wrapN(txt,wd,fs);if(r.ok&&r.lines<=Math.max(1,base))return {fs,lines:r.lines}}
  let lines=1,cur=0;const sp=tw(' ',9,true);for(const w of txt.split(/\s+/).filter(Boolean)){const ww=tw(w,9,true);if(ww>wd){lines+=(cur>0?1:0)+Math.ceil(ww/wd)-1;cur=ww-(Math.ceil(ww/wd)-1)*wd}else if(cur>0&&cur+sp+ww>wd){lines++;cur=ww}else cur+=(cur>0?sp:0)+ww}
  return {fs:9,lines};
}
function layoutEq(items,xS,xE){
  for(const it of items){
    const x1=xS(it.s),x2=xE(Math.max(it.e,it.s+0.15));
    it._x=x1+1;it._w=Math.max(x2-x1-2,COLW-2);
    const d=it.d,inner=it._w-16;
    const nm=d.name;
    const fn={fs:CARDFS,lines:wrapN(nm+(it.part?' '+it.part[0]+'/'+it.part[1]:''),(inner-11)*0.95,CARDFS).lines};it._fs=CARDFS;
    const l1=fn.lines*fn.fs*1.25/14.375;
    let pw=tw(cardLbl(it),10.5,true)+10+(d.witness==='O'?32:0)+28+(it.crew===3?28:0);
    const rows=Math.max(1,Math.ceil(pw/(it._w-14)));
    it._h=Math.ceil(5+l1*14.375+rows*14+(rows>0?1:0));
  }
  return packLanes(items);
}
function packLanes(items){
  // 가로로 겹치는 카드끼리만 위에서 아래로 1mm 간격으로 쌓음 (다른 카드의 높이에 영향받지 않음)
  const placed=[];let bottom=0;
  for(const it of [...items].sort((a,b)=>a._x-b._x||a.ord-b.ord)){
    let top=4;
    for(const q of placed)if(q._x<it._x+it._w+2&&it._x<q._x+q._w+2)top=Math.max(top,q._top+q._h+GAPMM);
    it._top=top;placed.push(it);bottom=Math.max(bottom,top+it._h);
  }
  return Math.max(bottom+2,LANEH);
}

function fitCards(){
  for(const row of $$('.erow')){
    const items=SCH.get(row.dataset.eq);if(!items)continue;
    const cards=new Map($$('.card',row).map(c=>[c.dataset.uid,c]));
    for(const it of items){const c=cards.get(it.inst.uid);if(!c)continue;c.style.height='auto';it._h=c.offsetHeight}
    let H=packLanes(items);
    const lf=$('.left',row),tl=$('.tl',row);if(lf&&tl){row.style.height='auto';tl.style.height='0px';lf.style.height='auto';H=Math.max(H,lf.offsetHeight)} // 과제명 칸 내용(제목·버튼)이 다 들어가도록 행 높이 확보
    for(const it of items){const c=cards.get(it.inst.uid);if(!c)continue;c.style.top=it._top+'px';c.style.height=it._h+'px'}
    row.style.height=H+'px';$$('.left,.tl',row).forEach(x=>x.style.height=H+'px');
  }
}
function openDayStatus(date){

const eqKey=e=>(e.title||'').trim()+'\u0001'+(e.code||'').trim();
const GROUPCOL=['#F4B183','#E2F0D9','#FFE699','#B4C7E7'];let GCOL=new Map();
const eqColor=e=>GCOL.get(eqKey(e))||'';
function buildGCol(vis){GCOL=new Map();let n=0;for(const e of vis){const k=eqKey(e);if(!GCOL.has(k))GCOL.set(k,GROUPCOL[n++%GROUPCOL.length])}} // 현재 대시보드 순서대로 과제(과제명+코드)별 자동 음영
function openPalette(btn,idx){openPaletteFor(btn,c=>{S.master.processes[idx].color=c;const sc=$('.pane').scrollTop;masterChanged();renderProc();$('.pane').scrollTop=sc},'사업장별 기본색 (2P 파랑 / 3P 청록)')}
function openPaletteFor(btn,apply,defLabel){
  if(RO)return;
  $('.pal')?.remove();
  const r=btn.getBoundingClientRect();
  let g='<h5>테마 색</h5><div class="g">';
  for(const k of THEME_ROWS)for(const c of THEME){const v=themeCell(c,k);g+=`<i data-c="${v}" style="background:${v}" title="${v}"></i>`}
  g+='</div><h5>표준 색</h5><div class="g">'+STDCOL.map(v=>`<i data-c="${v}" style="background:${v}" title="${v}"></i>`).join('')+'</div>';
  const el=document.createElement('div');el.className='pal';
  el.innerHTML=`<button class="btn sm def">${defLabel}</button>${g}`;
  // transpose theme grid: Excel shows columns by theme color, rows by tint -> grid already row-major per tint
  el.style.left=Math.min(r.left,innerWidth-250)+'px';el.style.top=Math.min(r.bottom+4,innerHeight-300)+'px';
  document.body.appendChild(el);
  const done=c=>{el.remove();apply(c)};
  el.querySelector('.def').onclick=()=>done('');
  el.querySelectorAll('i').forEach(i=>i.onclick=()=>done(i.dataset.c));
  setTimeout(()=>document.addEventListener('mousedown',function f(ev){if(!el.contains(ev.target)){el.remove();document.removeEventListener('mousedown',f)}}),0);
}

      <label class="fl">작업주체<select id="a_owner"><option value="HP">HP</option><option value="협력업체">협력업체</option></select></label>
      <label class="fl">직접인력 투입<select id="a_nm"><option value="">필요</option><option value="X">불필요 (LT만 소요, 부하 제외)</option></select></label>

      <label class="fl">2P 크레인<select id="a_c2"><option value="">미사용</option><option value="O">사용 (O)</option></select></label>
      <label class="fl">3P 크레인<select id="a_c3"><option value="">미사용</option><option>A</option><option>B</option><option>C</option><option>A or B</option><option>B or C</option></select></label>
      <label class="fl">공수 적용 단위<select id="a_unit"><option value="">Man hour</option><option value="LT">LT (일)</option></select></label>
      <label class="fl">공수 (Man hour: 시간, 8h=1man-day / LT: 일)<input id="a_md" type="number" step="0.1" min="0" value="0"></label>
      <label class="fl">비고<input id="a_rm"></label>
    </div>
    <label class="ck"><input type="checkbox" id="a_par"> 병행 수행 (후속 공정을 순연하지 않음)</label>
    <div class="note">기본 동작: 입력한 시작일에 이 공정이 들어가고, 이후 공정은 이 공정의 LT만큼 뒤로 순연됩니다.</div>
  </div><div class="mfoot"><button class="btn" id="a_cancel">취소</button><button class="btn pri" id="a_save">추가</button></div>`);
  const fill=()=>{
    const p=P.find(x=>x.id===$('#a_sel').value);if(!p)return;
    $('#a_name').value=p.name;$('#a_site').value=p.site||'2P';$('#a_wit').value=p.witness||'X';$('#a_owner').value=p.owner||'HP';$('#a_nm').value=p.noMan||'';
    $('#a_c2').value=p.crane2==='O'?'O':'';
    const c3=p.crane3==='X'?'':(p.crane3||'');$('#a_c3').value=[...$('#a_c3').options].some(o=>o.value===c3)?c3:'';
    $('#a_unit').value=p.unit||'';$('#a_md').value=stdMd(p.id,eq.cat,eq.model,eq.stage).v;$('#a_rm').value=p.remark||'';
  };
  $('#a_sel').onchange=fill;
  $('#a_cancel').onclick=closeModal;
  $('#a_save').onclick=()=>{
    const name=$('#a_name').value.trim(),sd=$('#a_start').value;
    if(!name){alert('공정명을 입력하거나 목록에서 선택하세요.');return}
    if(!sd){alert('공정 시작날짜를 입력하세요.');return}
    const pid=$('#a_sel').value||null,start=wdIdx(dn(sd));
    if(pid&&eq.procs.some(x=>x.pid===pid)&&!confirm(`'${name}' 공정은 이 장비에 이미 있습니다. 중복으로 한 번 더 추가할까요?`))return;
    const items=SCH.get(eq.id)||schedule(eq);
    const sorted=[...items].sort((a,b)=>a.ord-b.ord);
    let k=-1;sorted.forEach((x,i)=>{if(x.s<=start+1e-9)k=i});
    let order;
    if(!sorted.length)order=0;
    else if(k<0)order=sorted[0].ord-1;
    else if(k===sorted.length-1)order=sorted[k].ord+1;
    else order=sorted[k+1].ord>sorted[k].ord?(sorted[k].ord+sorted[k+1].ord)/2:sorted[k].ord+0.001;
    const base=P.find(x=>x.id===pid)||{};
    eq.procs.push({uid:uid(),pid,added:true,par:$('#a_par').checked,order,manualStart:start,crew:+$('#a_crew').value,md:Math.max(0,+$('#a_md').value||0),
      ov:{no:base.no??'추가',name,site:$('#a_site').value,witness:$('#a_wit').value,owner:$('#a_owner').value,noMan:$('#a_nm').value,unit:$('#a_unit').value,crane2:$('#a_c2').value,crane3:$('#a_c3').value,remark:$('#a_rm').value,type:'추가공정',parNo:'',parOff:''}});
    save();closeModal();render();toast('공정을 추가했습니다. 후속 공정이 순연되었습니다');
  };
}

/* settings */
function adjDate(str,dm,dd){const [y,m,d]=str.split('-').map(Number);let Y=y,M=m-1+dm;Y+=Math.floor(M/12);M=((M%12)+12)%12;const last=new Date(Date.UTC(Y,M+1,0)).getUTCDate();const x=new Date(Date.UTC(Y,M,Math.min(d,last)+dd));return x.toISOString().slice(0,10)}
const adjGs=id=>`<div class="adj">${[['-1m',-1,0],['+1m',1,0],['-7d',0,-7],['+7d',0,7],['-1d',0,-1],['+1d',0,1]].map(([l,m,d])=>`<button type="button" class="btn sm" data-adjd="${id}" data-m="${m}" data-d="${d}">${l}</button>`).join('')}</div>`;
const adjDays=id=>`<div class="adj">${[-10,10].map(n=>`<button type="button" class="btn sm" data-adjn="${id}" data-n="${n}">${n>0?'+':''}${n}</button>`).join('')}</div>`;
function wireAdj(){$$('#modalRoot [data-adjd]').forEach(b=>b.onclick=()=>{const i=$(b.dataset.adjd);if(i.value)i.value=adjDate(i.value,+b.dataset.m,+b.dataset.d)});
  $$('#modalRoot [data-adjn]').forEach(b=>b.onclick=()=>{const i=$(b.dataset.adjn);i.value=Math.min(400,Math.max(14,(+i.value||120)+(+b.dataset.n)))})}
function openSettings(){
  if(RO)return openViewSettings();
  const s=S.settings;
  openModal(`<div class="mhead">설정</div><div class="mbody"><div class="g2">
    <div><label class="fl">대시보드 시작일<input id="s_gs" type="date" value="${s.gridStart}"></label>${adjGs('#s_gs')}</div>
    <div><label class="fl">표시 일수 (달력일)<input id="s_days" type="number" min="14" max="400" value="${s.days}"></label>${adjDays('#s_days')}</div>
    <label class="fl">기본 일일 capa (Man-day, Total)<input id="s_capa" type="number" step="0.5" min="0" value="${s.capa}"></label>
    <label class="fl">기본 조 인원<select id="s_crew"><option value="2"${s.crew==2?' selected':''}>2인 1조</option><option value="3"${s.crew==3?' selected':''}>3인 1조</option></select></label>
  </div>
  <label class="ck"><input type="checkbox" id="s_we"${s.skipWeekend?' checked':''}> 주말은 비근무일 (공정 일정·capa 제외)</label>
  <label class="fl">휴일 목록 (한 줄에 하나, YYYY-MM-DD) <span class="note">공휴일·휴무일은 직접 확인 후 수정하세요</span><textarea id="s_hol" rows="5">${esc(s.holidays.join('\n'))}</textarea></label>
  <div class="note">셀별 capa 개별 수정 내용은 유지됩니다. <button class="btn sm" id="s_clr">개별 capa 초기화</button></div>
  </div><div class="mfoot"><button class="btn dng" id="s_reset" style="margin-right:auto">전체 초기화(샘플 포함)</button><button class="btn" id="s_cancel">취소</button><button class="btn pri" id="s_save">저장</button></div>`,true);
  $('#s_cancel').onclick=closeModal;wireAdj();

  $('#s_reset').onclick=()=>{if(confirm('모든 장비·공정·공수 수정 내용이 사라지고 엑셀 원본 값으로 돌아갑니다. 계속할까요?')){S=defaults();addSamples();buildCal();save();closeModal();render()}};
  $('#s_save').onclick=()=>{
    s.gridStart=$('#s_gs').value||s.gridStart;s.days=Math.min(400,Math.max(14,+$('#s_days').value||120));

  };
}

const DATA_FILE='plan_data.js';
const buildDataJs=()=>'window.PLAN_DATA='+JSON.stringify({savedAt:new Date().toISOString(),state:S})+';';
const hhmmss=()=>new Date().toLocaleTimeString('ko-KR',{hour12:false});

if(RO){
  document.body.classList.add('ro');$('#modeBadge').textContent='열람 전용';
  var lastSaved=null,okAt=null;
  function viewStat(ok){$('#shareStat').textContent=ok===false&&!lastSaved?`⚠ ${DATA_FILE} 없음 — 편집용 파일에서 공유 연결 후 같은 폴더에 두세요`:`동기화 ${okAt||'-'}`+(ok===false?' (연결 끊김, 재시도 중)':'')+(lastSaved?` · 편집 저장 ${new Date(lastSaved).toLocaleTimeString('ko-KR',{hour12:false})}`:'')}
  function pull(){
    const old=document.getElementById('dataScript');if(old)old.remove();
    window.PLAN_DATA=null;
    const sc=document.createElement('script');sc.id='dataScript';sc.src=DATA_FILE+'?_='+Date.now();
    sc.onload=()=>{const d=window.PLAN_DATA;if(d&&d.state){okAt=hhmmss();if(d.savedAt!==lastSaved){lastSaved=d.savedAt;S=d.state;migrate(S);applyVP(S);buildCal();render()}viewStat(true)}else viewStat(false)};
    sc.onerror=()=>viewStat(false);
    document.head.appendChild(sc);
  }
}else{
  var shareHandle=null,shareBusy=false,sharePending=false,shareTimer=null;
  const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('compressorPlanShare',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const idbSet=async h=>{try{const d=await idb();d.transaction('h','readwrite').objectStore('h').put(h,'file')}catch(e){}};
  const idbGet=async()=>{try{const d=await idb();return await new Promise(res=>{const q=d.transaction('h').objectStore('h').get('file');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}};
  const shareStat=t=>{if(!CLOUD)$('#shareStat').textContent=t};
  async function writeShare(){
    if(!shareHandle)return;
    if(shareBusy){sharePending=true;return}
    shareBusy=true;
    try{const w=await shareHandle.createWritable();await w.write(buildDataJs());await w.close();shareStat(`공유 저장됨 ${hhmmss()} (${shareHandle.name})`)}
    catch(err){shareStat('⚠ 공유 저장 실패: '+(err&&err.message||err)+' — 🔗 공유 연결을 다시 눌러 주세요')}
    shareBusy=false;if(sharePending){sharePending=false;writeShare()}
  }
  function scheduleShare(){if(CLOUD){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudPush,400);return}if(!shareHandle)return;clearTimeout(shareTimer);shareTimer=setTimeout(writeShare,300)}
  async function connectShare(){
    if(!window.showSaveFilePicker){const b=new Blob([buildDataJs()],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=DATA_FILE;a.click();toast(`이 브라우저는 자동 공유를 지원하지 않아 ${DATA_FILE}을 내려받았습니다. 열람용 파일과 같은 폴더에 덮어쓰세요 (Chrome/Edge 권장)`);return}
    try{
      const existing=confirm(`이미 만든 ${DATA_FILE} 파일에 연결하려면 [확인], 새로 만들려면 [취소]를 누르세요.`);
      if(existing){
        const [h]=await showOpenFilePicker({types:[{description:'공유 데이터',accept:{'text/javascript':['.js']}}]});
        shareHandle=h;
        if(confirm('선택한 파일의 내용을 불러와 현재 편집 내용을 대체할까요?\n[확인]=불러오기, [취소]=현재 편집 내용으로 파일을 덮어쓰기')){
          const txt=await (await h.getFile()).text();const m=txt.match(/^window\.PLAN_DATA=([\s\S]*);\s*$/);
          if(!m)throw new Error('올바른 공유 파일이 아닙니다');
          const d=JSON.parse(m[1]);if(!d.state)throw new Error('올바른 공유 파일이 아닙니다');
          S=d.state;migrate(S);buildCal();UNDO=[];REDO=[];lastStr=null;save();updUndo();render();
        }
      }else shareHandle=await showSaveFilePicker({suggestedName:DATA_FILE,types:[{description:'공유 데이터',accept:{'text/javascript':['.js']}}]});
      await idbSet(shareHandle);await writeShare();toast('공유가 연결되었습니다. 이후 수정 내용이 자동으로 저장됩니다');
    }catch(err){if(err&&err.name!=='AbortError')alert('공유 연결 실패: '+(err.message||err))}
  }
  $('#btnConnect').onclick=async()=>{
    if(shareHandle){const p=await shareHandle.queryPermission({mode:'readwrite'});if(p!=='granted'){const r=await shareHandle.requestPermission({mode:'readwrite'});if(r==='granted'){await writeShare();return}}else if(!confirm('다른 파일로 공유 연결을 바꿀까요? (현재 연결: '+shareHandle.name+')'))return}
    connectShare();
  };
  shareStat('공유 미연결 — 열람용 파일에 반영하려면 🔗 공유 연결');
  (async()=>{const h=await idbGet();if(!h)return;shareHandle=h;
    try{const p=await h.queryPermission({mode:'readwrite'});shareStat(p==='granted'?`공유 연결됨 (${h.name})`:`공유 파일(${h.name}) 권한 필요 — 🔗 공유 연결을 눌러 허용`)}catch(e){}})();
}

  S.equipments.push(newEq({title:'샘플-A (삭제 가능)',code:'SMP-001',unit:'#1',cat:'AIR',model:'SE-45',stage:3,start:'2026-10-12',options:['Core 조립 입회','치합(Soft)','Spare part 시운전','치합(Hard)',"Leak' test"],moveLine:'A'}));

/* ---------- 클라우드(Firebase) 저장·접속 ---------- */
const CLIENT=Math.random().toString(36).slice(2,10);
var fbDoc=null,fbAuth=null,cloudAt=null,cloudTimer=null,cloudReady=false,cloudBusy=false,cloudPend=false,cloudWarned=false;
if(CLOUD){try{firebase.initializeApp(FBC);fbDoc=firebase.firestore().doc('plan/main');if(!RO)fbAuth=firebase.auth()}catch(e){console.error(e)}}
const cstat=t=>{$('#shareStat').textContent=t};
async function cloudPush(){
  if(!CLOUD||RO||!cloudReady)return;
  if(cloudBusy){cloudPend=true;return}
  cloudBusy=true;
  try{
    const json=JSON.stringify(S);
    if(json.length>900000&&!cloudWarned){cloudWarned=true;alert('저장 데이터가 커서 클라우드 한도(약 1MB)에 가까워졌습니다. 불필요한 완료 장비를 정리해 주세요.')}
    const at=new Date().toISOString();cloudAt=at;
    await fbDoc.set({savedAt:at,by:CLIENT,json});
    cstat(`☁ 클라우드 저장됨 ${hhmmss()}`);
  }catch(err){cstat('⚠ 클라우드 저장 실패: '+(err&&(err.code||err.message)||err)+' — 로그인이 만료되었으면 새로고침 후 다시 로그인하세요')}
  cloudBusy=false;if(cloudPend){cloudPend=false;cloudPush()}
}
const AUTHERR={'auth/invalid-credential':'비밀번호가 올바르지 않습니다.','auth/wrong-password':'비밀번호가 올바르지 않습니다.','auth/user-not-found':'편집 계정이 아직 만들어지지 않았습니다. 설정 가이드를 확인하세요.','auth/too-many-requests':'시도 횟수가 많아 잠시 차단되었습니다. 잠시 후 다시 시도하세요.','auth/network-request-failed':'네트워크 연결을 확인하세요.','auth/weak-password':'비밀번호가 너무 약합니다.','auth/requires-recent-login':'다시 로그인한 뒤 시도하세요.'};
const authMsg=e=>AUTHERR[e&&e.code]||('오류: '+(e&&(e.code||e.message)||e));
function loginGate(){
  return new Promise(async res=>{
    const keep=localStorage.getItem('planKeep')==='1',P=firebase.auth.Auth.Persistence;
    try{await fbAuth.setPersistence(keep?P.LOCAL:P.SESSION)}catch(e){}
    const u=await new Promise(r=>{const un=fbAuth.onAuthStateChanged(x=>{un();r(x)})});
    if(u&&u.email===EDITOR_EMAIL){res(u);return}
    if(u)try{await fbAuth.signOut()}catch(e){}
    const root=$('#loginRoot');
    root.innerHTML=`<form class="lgbox" id="lgForm"><h2>🔒 압축기 생산계획 · 편집용</h2><div style="font-size:13px;color:var(--ink2)">편집 권한이 있는 담당자만 접속할 수 있습니다. 비밀번호를 입력하세요.</div>
      <input type="password" id="lgPw" placeholder="비밀번호" autocomplete="current-password" autofocus>
      <label class="ck"><input type="checkbox" id="lgKeep"${keep?' checked':''}> 이 기기에서 로그인 유지 (공용 PC에서는 해제)</label>
      <div class="err" id="lgErr"></div><button class="btn pri" id="lgGo" type="submit" style="justify-content:center;padding:9px">로그인</button></form>`;
    root.classList.add('on');setTimeout(()=>$('#lgPw').focus(),50);
    $('#lgForm').onsubmit=async ev=>{
      ev.preventDefault();const pw=$('#lgPw').value;if(!pw)return;
      $('#lgGo').disabled=true;$('#lgErr').textContent='';
      try{
        const k=$('#lgKeep').checked;localStorage.setItem('planKeep',k?'1':'0');
        await fbAuth.setPersistence(k?P.LOCAL:P.SESSION);
        const c=await fbAuth.signInWithEmailAndPassword(EDITOR_EMAIL,pw);
        root.classList.remove('on');root.innerHTML='';res(c.user);
      }catch(e){$('#lgErr').textContent=authMsg(e);$('#lgGo').disabled=false;$('#lgPw').select()}
    };
  });
}
function openPwChange(){
  openModal(`<div class="mhead">🔑 편집용 비밀번호 변경</div><div class="mbody">
    <label class="fl">현재 비밀번호<input type="password" id="pw0" autocomplete="current-password"></label>
    <label class="fl">새 비밀번호 (8자 이상)<input type="password" id="pw1" autocomplete="new-password"></label>
    <label class="fl">새 비밀번호 확인<input type="password" id="pw2" autocomplete="new-password"></label>
    <div class="warn" id="pwErr" style="display:none"></div>
    <div class="note">변경 후에는 편집용 주소로 접속할 때 새 비밀번호를 사용합니다. 편집 담당자들에게 새 비밀번호를 직접 전달하세요.</div></div>
    <div class="mfoot"><button class="btn" id="pw_c">취소</button><button class="btn pri" id="pw_s">변경</button></div>`,true);
  $('#pw_c').onclick=closeModal;
  const err=m=>{const e=$('#pwErr');e.textContent=m;e.style.display=m?'block':'none'};
  $('#pw_s').onclick=async()=>{
    const a=$('#pw0').value,b=$('#pw1').value,c=$('#pw2').value;
    if(!a)return err('현재 비밀번호를 입력하세요.');
    if(b.length<8)return err('새 비밀번호는 8자 이상으로 입력하세요.');
    if(b!==c)return err('새 비밀번호 확인이 일치하지 않습니다.');
    if(a===b)return err('현재 비밀번호와 다른 비밀번호를 입력하세요.');
    $('#pw_s').disabled=true;err('');
    try{
      const u=fbAuth.currentUser;
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,a));
      await u.updatePassword(b);
      closeModal();toast('비밀번호를 변경했습니다. 다음 접속부터 새 비밀번호를 사용하세요');
    }catch(e){err(authMsg(e));$('#pw_s').disabled=false}
  };
}
function bootEdit(S0){
  S=S0;
  if(!S){S=defaults();buildCal();addSamples();save()}else{buildCal();lastStr=JSON.stringify(S);
    if(S.master.seedVer!==SEED.version){
      const ok=confirm('엑셀(사내 시트) 공정 정의와 표준공수가 업데이트되었습니다.\n새 내용으로 갱신할까요?\n[확인] 갱신 · [취소] 현재 값 유지\n※ 갱신하면 엑셀에 있는 공정의 정의(작업장·옵션·크레인 등)와 표준공수 값이 덮어쓰입니다.\n   (사용자가 추가한 공정, 공정 색상, 장비별 일정은 유지됩니다)');
      if(ok){const snaps=S.equipments.map(eq=>new Map(schedule(eq).map(i=>[i.inst.uid,i.cur])));mergeSeed();syncOpts();S.equipments.forEach((eq,k)=>withKeep(eq,()=>{},snaps[k]))}
      S.master.seedVer=SEED.version;save();
    }}
  updUndo();render();
}

if(RO){
  S=defaults();applyVP(S);buildCal();render();
  if(CLOUD&&fbDoc){
    cstat('☁ 연결 중…');
    fbDoc.onSnapshot(snap=>{
      okAt=hhmmss();
      if(!snap.exists){cstat('⚠ 아직 편집용에서 저장된 데이터가 없습니다');return}
      const d=snap.data();
      if(d.savedAt!==lastSaved){lastSaved=d.savedAt;try{S=JSON.parse(d.json);migrate(S);applyVP(S);buildCal();render()}catch(e){cstat('⚠ 데이터를 읽지 못했습니다');return}}
      cstat(`☁ 실시간 연결 · 최종 편집 저장 ${new Date(d.savedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}`);
    },err=>cstat('⚠ 연결 실패: '+(err&&err.code||err)));
  }else{viewStat(false);pull();setInterval(pull,2000)}
}else if(CLOUD&&fbDoc){
  $('#btnConnect').style.display='none';$('#btnPw').style.display='inline-flex';$('#btnLogout').style.display='inline-flex';
  $('#btnPw').onclick=openPwChange;
  $('#btnLogout').onclick=async()=>{try{await fbAuth.signOut()}catch(e){}localStorage.setItem('planKeep','0');location.reload()};
  cstat('☁ 로그인 필요');
  (async()=>{
    await loginGate();
    cstat('☁ 데이터 불러오는 중…');
    let snap=null;try{snap=await fbDoc.get()}catch(e){alert('클라우드 데이터를 불러오지 못했습니다: '+(e.code||e.message)+'\n(인터넷 연결 또는 Firestore 규칙을 확인하세요) 이 상태에서는 클라우드에 저장되지 않습니다.')}
    let st=null;
    if(snap&&snap.exists){try{const d=snap.data();st=JSON.parse(d.json);migrate(st);cloudAt=d.savedAt;persist(JSON.stringify(st))}catch(e){st=null}}
    cloudReady=!!snap;
    bootEdit(st||load());
    if(snap&&!snap.exists)await cloudPush();
    else if(snap)cstat('☁ 클라우드 연결됨');
    if(snap)fbDoc.onSnapshot(s=>{
      if(!s.exists||s.metadata.hasPendingWrites)return;
      const d=s.data();if(d.by===CLIENT||d.savedAt===cloudAt)return;
      try{cloudAt=d.savedAt;S=JSON.parse(d.json);migrate(S);buildCal();lastStr=JSON.stringify(S);persist(lastStr);UNDO=[];REDO=[];updUndo();closeModal();render();toast('다른 편집자의 변경 내용을 반영했습니다');cstat(`☁ 다른 편집자 변경 반영 ${hhmmss()}`)}catch(e){}
    });
  })();
}else{
  bootEdit(load());
}
